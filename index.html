<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üretici Ziyaret Sistemi</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px;color:#17202a}
.card{max-width:520px;margin:auto;background:white;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}
h1{font-size:22px;margin-top:0}.producer{font-size:26px;font-weight:700;margin:14px 0}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#111827;color:white;font-size:17px;margin-top:10px}
button.secondary{background:#e5e7eb;color:#111827}.status{padding:12px;border-radius:10px;background:#f1f5f9;margin:14px 0;line-height:1.5}
.ok{background:#dcfce7}.bad{background:#fee2e2}.small{font-size:13px;color:#64748b}
</style>
</head>
<body>
<div class="card">
<h1>Üretici Ziyaret Sistemi</h1>
<div class="producer" id="producer">Üretici seçilmedi</div>
<div class="status" id="status">QR ile giriş yapıldığında üretici burada görünecek.</div>
<button id="start" onclick="startVisit()" disabled>ZİYARETE BAŞLA</button>
<button id="end" onclick="endVisit()" disabled class="secondary">ZİYARETİ BİTİR</button>
<div class="small" id="info"></div>
</div>

<script>
const producers={
  lod:{name:"Lodos Ayakkabı",lat:41.0391997259411,lon:28.806444996881826},
  mos:{name:"Mostar Ayakkabı",lat:41.19097164451511,lon:28.746879110381474}
};

const key=new URLSearchParams(location.search).get("p");
const p=producers[key];
const startBtn=document.getElementById("start");
const endBtn=document.getElementById("end");
const statusEl=document.getElementById("status");

function distance(lat1,lon1,lat2,lon2){
 const R=6371000, r=Math.PI/180;
 const a=Math.sin((lat2-lat1)*r/2)**2+
   Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin((lon2-lon1)*r/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}

function now(){
 return new Date().toLocaleString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

function gps(success){
 if(!navigator.geolocation){
   statusEl.className="status bad";
   statusEl.textContent="Bu tarayıcı konum bilgisini desteklemiyor.";
   return;
 }
 statusEl.className="status";
 statusEl.textContent="GPS konumu alınıyor...";
 navigator.geolocation.getCurrentPosition(
   success,
   e=>{
     statusEl.className="status bad";
     statusEl.textContent="Konum alınamadı: "+e.message;
   },
   {enableHighAccuracy:true,timeout:20000,maximumAge:0}
 );
}

if(p){
 document.getElementById("producer").textContent=p.name;
 startBtn.disabled=false;

 // Sayfa yenilenirse aktif ziyareti hatırla.
 const active=localStorage.getItem("activeVisit");
 if(active){
   try{
     const v=JSON.parse(active);
     if(v.producer===p.name){
       startBtn.disabled=true;
       endBtn.disabled=false;
       statusEl.className="status ok";
       statusEl.textContent="🟢 Aktif ziyaret devam ediyor. Ziyareti bitirebilirsiniz.";
     }
   }catch(e){}
 }
}

function startVisit(){
 if(!p)return;

 startBtn.disabled=true;

 gps(pos=>{
   const d=Math.round(distance(
     pos.coords.latitude,pos.coords.longitude,p.lat,p.lon
   ));

   if(d>300){
     statusEl.className="status bad";
     statusEl.innerHTML="🔴 Konum doğrulanamadı<br>Üreticiye uzaklık: "+d+" metre";
     startBtn.disabled=false;
     return;
   }

   const visit={
     producer:p.name,
     startTime:now(),
     startTimestamp:Date.now(),
     startDistance:d,
     startLat:pos.coords.latitude,
     startLon:pos.coords.longitude
   };

   localStorage.setItem("activeVisit",JSON.stringify(visit));

   statusEl.className="status ok";
   statusEl.innerHTML="🟢 Ziyaret başladı<br>Mesafe: "+d+" metre<br>Başlangıç: "+visit.startTime;

   // KRİTİK: GPS başarılı olur olmaz buton kesin olarak aktifleşir.
   startBtn.disabled=true;
   endBtn.disabled=false;
 });
}

function endVisit(){
 if(!p)return;

 endBtn.disabled=true;

 gps(pos=>{
   const raw=localStorage.getItem("activeVisit");

   if(!raw){
     statusEl.className="status bad";
     statusEl.textContent="Aktif ziyaret bulunamadı.";
     endBtn.disabled=false;
     return;
   }

   let visit;
   try{visit=JSON.parse(raw);}catch(e){
     localStorage.removeItem("activeVisit");
     statusEl.className="status bad";
     statusEl.textContent="Ziyaret kaydı okunamadı.";
     endBtn.disabled=false;
     return;
   }

   const d=Math.round(distance(
     pos.coords.latitude,pos.coords.longitude,p.lat,p.lon
   ));

   const endTime=now();
   const durationMs=Date.now()-visit.startTimestamp;
   const minutes=Math.max(0,Math.round(durationMs/60000));

   // Merkezi kayıt sistemi sonraki aşamada eklenecek.
   // Şimdilik bu cihazda güvenli test amacıyla tutuluyor.
   const completed={
     producer:p.name,
     startTime:visit.startTime,
     endTime:endTime,
     durationMinutes:minutes,
     startDistance:visit.startDistance,
     endDistance:d
   };
   localStorage.setItem("lastCompletedVisit",JSON.stringify(completed));
   localStorage.removeItem("activeVisit");

   statusEl.className="status ok";
   statusEl.innerHTML=
     "🟢 Ziyaret tamamlandı<br>"+
     "Giriş: "+visit.startTime+"<br>"+
     "Çıkış: "+endTime+"<br>"+
     "Kalış süresi: "+minutes+" dakika";

   startBtn.disabled=false;
   endBtn.disabled=true;
 });
}
</script>
</body>
</html>
